name: PR 12 resident fallback probe
on:
  push:
    branches: [verify/pr12-resident-fallback]
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm db:up
      - run: pnpm --filter @dynosty/game-core build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e tests/e2e/approved-play.spec.ts -g '대표 모델 요청 실패' --reporter=line
      - if: always()
        run: pnpm db:down
