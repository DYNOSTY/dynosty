name: 전체 브라우저 회귀 검사

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: "검사 이름에 이 글자가 들어간 것만 실행(비우면 전체)"
        required: false
        default: ""
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 검사를 8대에 나눠 동시에 돌린다. 한 대에서 1개씩 돌리면 40~80분 걸린다.
  browser-regression:
    name: 브라우저 검사 ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm db:up
      - run: pnpm db:check
      - run: pnpm exec playwright install --with-deps chromium
      # --fully-parallel lets the shards split a long spec file by test instead of by file.
      - name: 브라우저 검사
        env:
          GREP: ${{ inputs.grep }}
        run: |
          args=(--fully-parallel --shard=${{ matrix.shard }}/8 --reporter=blob,github)
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          pnpm test:e2e "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: pnpm db:down

  # 나눠 돌린 결과를 하나의 보고서와 요약으로 합친다.
  report:
    name: 브라우저 검사 결과 합치기
    if: ${{ !cancelled() }}
    needs: browser-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright.config.ts imports the built game core.
      - run: pnpm --filter @dynosty/game-core build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: 보고서 합치기
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: pnpm exec playwright merge-reports --reporter=html,json ./all-blob-reports
      - name: 요약
        run: node scripts/e2e-summary.mjs results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            results.json
          retention-days: 14
